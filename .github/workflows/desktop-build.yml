name: Desktop build matrix

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build one target or the full release matrix
        required: true
        type: choice
        options:
          - all
          - arm64
          - macos-intel
          - windows
        default: all
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-intel:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-intel' }}
    name: x86_64-apple-darwin
    runs-on: macos-15-intel
    env:
      NUITKA_BUILD_JOBS: 2
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: dashboard
      - run: npm run tauri -- build --bundles app
        working-directory: dashboard
      - name: Create DMG without mounting an image
        run: sh ../scripts/build_macos_dmg.sh "src-tauri/target/release/bundle/macos/DevAgent Orchestrator.app" "src-tauri/target/release/bundle/dmg/DevAgent Orchestrator_x64.dmg"
        working-directory: dashboard
      - name: Smoke packaged backend sidecar
        run: python ../scripts/smoke_desktop_backend.py src-tauri/binaries/devagent-backend-x86_64-apple-darwin
        working-directory: dashboard
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-x86_64-apple-darwin
          path: dashboard/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows' }}
    name: x86_64-pc-windows-msvc
    runs-on: windows-2025
    env:
      NUITKA_BUILD_JOBS: 2
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: dashboard
      - run: npm run tauri -- build
        working-directory: dashboard
      - name: Smoke packaged backend sidecar
        run: python ../scripts/smoke_desktop_backend.py src-tauri/binaries/devagent-backend-x86_64-pc-windows-msvc.exe
        working-directory: dashboard
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: dashboard/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  arm64:
    if: >-
      ${{ always() &&
          (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'arm64') &&
          (needs.macos-intel.result == 'success' || needs.macos-intel.result == 'skipped') &&
          (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    needs:
      - macos-intel
      - windows
    name: aarch64-apple-darwin
    runs-on: macos-15
    env:
      NUITKA_BUILD_JOBS: 2
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: dashboard
      - run: npm run tauri -- build --bundles app
        working-directory: dashboard
      - name: Create DMG without mounting an image
        run: sh ../scripts/build_macos_dmg.sh "src-tauri/target/release/bundle/macos/DevAgent Orchestrator.app" "src-tauri/target/release/bundle/dmg/DevAgent Orchestrator_arm64.dmg"
        working-directory: dashboard
      - name: Smoke packaged backend sidecar
        run: python ../scripts/smoke_desktop_backend.py src-tauri/binaries/devagent-backend-aarch64-apple-darwin
        working-directory: dashboard
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-aarch64-apple-darwin
          path: dashboard/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
