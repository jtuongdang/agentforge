name: DevAgent Orchestrator CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-process-tree:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests/test_core.py -k "terminate_process_tree or descendants_after_worker_exits or job_object_kills_worker" -q
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
  license-hub:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: dotnet build license-hub.tests/LicenseHub.Tests.csproj --nologo --verbosity minimal -m:1
      - run: dotnet test license-hub.tests/LicenseHub.Tests.csproj --no-build --nologo --verbosity minimal -m:1
      - run: docker build -f Dockerfile -t clinic-license-hub:ci .
        working-directory: license-hub
      - run: python -m pytest backend/tests/test_license_hub_integration.py -q
        env:
          CLINIC_ORCHESTRATOR_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
  desktop-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: dashboard
      - run: node --check ../scripts/build_desktop.mjs
        working-directory: dashboard
      - run: npm run tauri -- info
        working-directory: dashboard
